          <circle cx="0" cy="0" r="24" fill="#10b981" fill-opacity="0.15" />
          <circle cx="0" cy="0" r="21" fill="none" stroke="#10b981" stroke-width="1.2" stroke-dasharray="3 3" class="reticle" />
          <circle cx="0" cy="0" r="14" fill="url(#planet-emerald)" />
          <rect x="-64" y="20" width="128" height="34" rx="6" fill="url(#hud-glass)" stroke="#10b981" stroke-width="1.2" />
          <text x="-54" y="34" class="sans" fill="#f8fafc" font-size="11" font-weight="bold">OnlineSevak</text>
          <text x="-54" y="47" class="mono" fill="#34d399" font-size="9">Flutter + Supabase</text>
        </g>
      </g>
    </g>
  </g>

  <g class="orbit-3">
