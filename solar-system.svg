<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="100%" height="580">
  <defs>
    <!-- Deep Space Nebula Background -->
    <radialGradient id="space-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="45%" stop-color="#070a14" />
      <stop offset="100%" stop-color="#03050a" />
    </radialGradient>

    <radialGradient id="sun-corona" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1" />
      <stop offset="35%" stop-color="#f59e0b" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#ea580c" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0" />
    </radialGradient>

    <!-- 3D Spherical Planet Shading -->
    <radialGradient id="sun-sphere" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#fde047" />
      <stop offset="75%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </radialGradient>

    <radialGradient id="planet-cyan" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#cffafe" />
      <stop offset="35%" stop-color="#22d3ee" />
      <stop offset="80%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#082f49" />
    </radialGradient>

    <radialGradient id="planet-emerald" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#d1fae5" />
      <stop offset="35%" stop-color="#10b981" />
      <stop offset="80%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </radialGradient>

    <radialGradient id="planet-purple" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f3e8ff" />
      <stop offset="35%" stop-color="#c084fc" />
      <stop offset="80%" stop-color="#6b21a8" />
      <stop offset="100%" stop-color="#2e1065" />
    </radialGradient>

    <radialGradient id="planet-crimson" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffe4e6" />
      <stop offset="35%" stop-color="#fb7185" />
      <stop offset="80%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#4c0519" />
    </radialGradient>

    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .hud-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .hud-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    .orbit-ring {
      fill: none;
      stroke: #1e293b;
      stroke-width: 1.5;
      stroke-dasharray: 6 6;
      transition: stroke 0.3s ease;
    }

    /* Orbital Physics around Center (450, 290) */
    .orbit-1 { transform-origin: 450px 290px; animation: spin 18s linear infinite; }
    .orbit-2 { transform-origin: 450px 290px; animation: spin 28s linear infinite; }
    .orbit-3 { transform-origin: 450px 290px; animation: spin 40s linear infinite; }
    .orbit-4 { transform-origin: 450px 290px; animation: spin 54s linear infinite; }

    .counter-1 { animation: counterSpin 18s linear infinite; }
    .counter-2 { animation: counterSpin 28s linear infinite; }
    .counter-3 { animation: counterSpin 40s linear infinite; }
    .counter-4 { animation: counterSpin 54s linear infinite; }

    /* Interactive Hover States: Pause Orbit & Highlight HUD */
    .orbit-1:hover, .orbit-1:hover .counter-1,
    .orbit-2:hover, .orbit-2:hover .counter-2,
    .orbit-3:hover, .orbit-3:hover .counter-3,
    .orbit-4:hover, .orbit-4:hover .counter-4 {
      animation-play-state: paused;
    }

    .planet-link { cursor: pointer; }
    .target-reticle {
      opacity: 0;
      transition: all 0.25s ease;
    }
    .hud-tag {
      fill: #0f172a;
      fill-opacity: 0.88;
      stroke-width: 1.2;
      transition: all 0.25s ease;
    }
    .planet-link:hover .target-reticle {
      opacity: 1;
    }
    .planet-link:hover .hud-tag {
      fill: #1e293b;
      stroke-width: 2;
    }

    .dock-pill {
      fill: #0f172a;
      stroke: #1e293b;
      stroke-width: 1.2;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .dock-link:hover .dock-pill {
      fill: #1e293b;
      stroke: #38bdf8;
    }

    .sun-pulse { animation: flare 3s ease-in-out infinite; }
    .twinkle { animation: starTwinkle 2.5s ease-in-out infinite; }

    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes counterSpin { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
    @keyframes flare { 0%, 100% { transform: scale(1); opacity: 0.85; } 50% { transform: scale(1.12); opacity: 1; } }
    @keyframes starTwinkle { 0%, 100% { opacity: 0.9; } 50% { opacity: 0.2; } }
  </style>

  <!-- Space Viewport & Frame -->
  <rect width="900" height="580" rx="16" fill="url(#space-bg)" />
  <rect x="4" y="4" width="892" height="572" rx="14" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Polar Astrometry Crosshairs -->
  <line x1="450" y1="45" x2="450" y2="520" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.5" />
  <line x1="40" y1="290" x2="860" y2="290" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.5" />

  <!-- Starfield -->
  <g fill="#94a3b8">
    <circle cx="85" cy="95" r="1.5" class="twinkle" /><circle cx="210" cy="70" r="1" />
    <circle cx="780" cy="90" r="1.5" class="twinkle" /><circle cx="820" cy="210" r="1" />
    <circle cx="110" cy="430" r="1.2" /><circle cx="240" cy="480" r="1.5" class="twinkle" />
    <circle cx="740" cy="450" r="1.5" /><circle cx="670" cy="140" r="1" />
    <circle cx="150" cy="230" r="1.2" class="twinkle" /><circle cx="810" cy="380" r="1.2" />
  </g>
  <g fill="#38bdf8">
    <circle cx="165" cy="145" r="1.8" class="twinkle" /><circle cx="730" cy="320" r="1.8" />
    <circle cx="320" cy="85" r="1.5" /><circle cx="590" cy="470" r="1.8" class="twinkle" />
  </g>

  <!-- Top Telemetry Header Bar -->
  <rect x="4" y="4" width="892" height="40" rx="14" fill="#090d16" fill-opacity="0.85" />
  <line x1="4" y1="44" x2="896" y2="44" stroke="#1e293b" stroke-width="1" />
  <circle cx="26" cy="24" r="5" fill="#22d3ee" filter="url(#soft-glow)" />
  <text x="40" y="28" class="hud-mono" fill="#f8fafc" font-size="12" font-weight="bold">ASTROMETRY_HUD // SOLAR SYSTEM: PSHRAVAN04</text>
  <text x="615" y="28" class="hud-mono" fill="#38bdf8" font-size="11">[HOVER PLANET TO LOCK • CLICK TO LAUNCH]</text>

  <!-- Orbital Rings -->
  <circle cx="450" cy="290" r="82" class="orbit-ring" />
  <circle cx="450" cy="290" r="134" class="orbit-ring" />
  <circle cx="450" cy="290" r="186" class="orbit-ring" />
  <circle cx="450" cy="290" r="236" class="orbit-ring" />

  <!-- ================= CENTRAL SUN: PSHRAVAN04 ================= -->
  <a href="https://github.com/Pshravan04" target="_blank" class="planet-link">
    <g>
      <circle cx="450" cy="290" r="54" fill="url(#sun-corona)" class="sun-pulse" style="transform-origin: 450px 290px;" />
      <circle cx="450" cy="290" r="28" fill="url(#sun-sphere)" filter="url(#soft-glow)" />
      <circle cx="450" cy="290" r="36" fill="none" stroke="#fde047" stroke-width="1.5" stroke-dasharray="4 4" class="target-reticle" />
      
      <rect x="394" y="326" width="112" height="22" rx="6" class="hud-tag" stroke="#f59e0b" />
      <text x="405" y="341" class="hud-mono" fill="#fde047" font-size="11" font-weight="bold">☀️ PSHRAVAN04</text>
    </g>
  </a>

  <!-- ================= ORBIT 1: LATTICESKILL ================= -->
  <g class="orbit-1">
    <g transform="translate(450, 208)">
      <g class="counter-1">
        <a href="https://github.com/Pshravan04/LatticeSkill" target="_blank" class="planet-link">
          <!-- Target Reticle on Hover -->
          <circle cx="0" cy="0" r="20" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="3 3" class="target-reticle" />
          <!-- 3D Planet Sphere -->
          <circle cx="0" cy="0" r="12" fill="url(#planet-cyan)" filter="url(#soft-glow)" />
          <!-- Orbiting Moon -->
          <circle cx="16" cy="-10" r="3" fill="#e2e8f0" />
          <!-- HUD Callout Badge -->
          <rect x="-62" y="18" width="124" height="32" rx="6" class="hud-tag" stroke="#22d3ee" />
          <text x="-52" y="32" class="hud-sans" fill="#f8fafc" font-size="11" font-weight="bold">LatticeSkill ↗</text>
          <text x="-52" y="44" class="hud-mono" fill="#22d3ee" font-size="9">Next.js • Realtime</text>
        </a>
      </g>
    </g>
  </g>

  <!-- ================= ORBIT 2: ONLINESEVAK ================= -->
  <g class="orbit-2">
    <g transform="translate(584, 290)">
      <g class="counter-2">
        <a href="https://github.com/Pshravan04/OnlineSevak" target="_blank" class="planet-link">
          <circle cx="0" cy="0" r="22" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3 3" class="target-reticle" />
          <circle cx="0" cy="0" r="14" fill="url(#planet-emerald)" filter="url(#soft-glow)" />
          <rect x="-64" y="20" width="128" height="32" rx="6" class="hud-tag" stroke="#10b981" />
          <text x="-54" y="34" class="hud-sans" fill="#f8fafc" font-size="11" font-weight="bold">OnlineSevak ↗</text>
          <text x="-54" y="46" class="hud-mono" fill="#34d399" font-size="9">Flutter • Geo-Civic</text>
        </a>
      </g>
    </g>
  </g>

  <!-- ================= ORBIT 3: PROPTECH & CRM SUITE ================= -->
  <g class="orbit-3">
    <g transform="translate(264, 290)">
      <g class="counter-3">
        <a href="https://github.com/Pshravan04?tab=repositories" target="_blank" class="planet-link">
          <circle cx="0" cy="0" r="25" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="3 3" class="target-reticle" />
          <!-- Planetary Rings -->
          <ellipse cx="0" cy="0" rx="26" ry="7" fill="none" stroke="#d8b4fe" stroke-width="2.5" transform="rotate(-18)" />
          <circle cx="0" cy="0" r="15" fill="url(#planet-purple)" filter="url(#soft-glow)" />
          <rect x="-68" y="22" width="136" height="32" rx="6" class="hud-tag" stroke="#a855f7" />
          <text x="-58" y="36" class="hud-sans" fill="#f8fafc" font-size="11" font-weight="bold">PropTech Portals ↗</text>
          <text x="-58" y="48" class="hud-mono" fill="#c084fc" font-size="9">React • CRM • Web</text>
        </a>
      </g>
    </g>
  </g>

  <!-- ================= ORBIT 4: AI & VIBE LAB ================= -->
  <g class="orbit-4">
    <g transform="translate(450, 54)">
      <g class="counter-4">
        <a href="https://github.com/Pshravan04?tab=repositories" target="_blank" class="planet-link">
          <circle cx="0" cy="0" r="21" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="3 3" class="target-reticle" />
          <circle cx="0" cy="0" r="13" fill="url(#planet-crimson)" filter="url(#soft-glow)" />
          <rect x="-64" y="19" width="128" height="32" rx="6" class="hud-tag" stroke="#f43f5e" />
          <text x="-54" y="33" class="hud-sans" fill="#f8fafc" font-size="11" font-weight="bold">AI & Vibe Lab ↗</text>
          <text x="-54" y="45" class="hud-mono" fill="#fb7185" font-size="9">Python • AI Agents</text>
        </a>
      </g>
    </g>
  </g>

  <!-- ================= BOTTOM INTERACTIVE LAUNCH DOCK ================= -->
  <g transform="translate(24, 526)">
    <a href="https://github.com/Pshravan04" target="_blank" class="dock-link">
      <rect x="0" y="0" width="160" height="34" rx="8" class="dock-pill" />
      <circle cx="18" cy="17" r="5" fill="#fbbf24" />
      <text x="32" y="21" class="hud-mono" fill="#f8fafc" font-size="11" font-weight="bold">CORE: Pshravan04</text>
    </a>

    <a href="https://github.com/Pshravan04/LatticeSkill" target="_blank" class="dock-link">
      <rect x="172" y="0" width="164" height="34" rx="8" class="dock-pill" />
      <circle cx="190" cy="17" r="5" fill="#22d3ee" />
      <text x="204" y="21" class="hud-mono" fill="#f8fafc" font-size="11" font-weight="bold">01: LatticeSkill ↗</text>
    </a>

    <a href="https://github.com/Pshravan04/OnlineSevak" target="_blank" class="dock-link">
      <rect x="348" y="0" width="164" height="34" rx="8" class="dock-pill" />
      <circle cx="366" cy="17" r="5" fill="#10b981" />
      <text x="380" y="21" class="hud-mono" fill="#f8fafc" font-size="11" font-weight="bold">02: OnlineSevak ↗</text>
    </a>

    <a href="https://github.com/Pshravan04?tab=repositories" target="_blank" class="dock-link">
      <rect x="524" y="0" width="164" height="34" rx="8" class="dock-pill" />
      <circle cx="542" cy="17" r="5" fill="#c084fc" />
      <text x="556" y="21" class="hud-mono" fill="#f8fafc" font-size="11" font-weight="bold">03: PropTech CRM ↗</text>
    </a>

    <a href="https://github.com/Pshravan04?tab=repositories" target="_blank" class="dock-link">
      <rect x="700" y="0" width="152" height="34" rx="8" class="dock-pill" />
      <circle cx="718" cy="17" r="5" fill="#fb7185" />
      <text x="732" y="21" class="hud-mono" fill="#f8fafc" font-size="11" font-weight="bold">04: AI Vibe Lab ↗</text>
    </a>
  </g>
</svg>
