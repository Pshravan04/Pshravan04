          <circle cx="0" cy="0" r="24" fill="none" stroke="#c084fc" stroke-width="1.2" stroke-dasharray="3 3" class="reticle" />
          <ellipse cx="0" cy="0" rx="26" ry="7" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-opacity="0.55" transform="rotate(-18)" />
          <circle cx="0" cy="0" r="15" fill="url(#planet-purple)" />
          <path d="M -24 8 A 26 7 0 0 0 24 -8" fill="none" stroke="#e9d5ff" stroke-width="2.5" transform="rotate(-18)" />
          <rect x="-68" y="22" width="136" height="34" rx="6" fill="url(#hud-glass)" stroke="#a855f7" stroke-width="1.2" />
          <text x="-58" y="36" class="sans" fill="#f8fafc" font-size="11" font-weight="bold">PropTech Portals</text>
          <text x="-58" y="49" class="mono" fill="#c084fc" font-size="9">React + CRM Suite</text>
        </g>
      </g>
    </g>
  </g>

  <g class="orbit-4">
    <g transform="translate(450, 51)">
      <g class="counter-4">
        <g class="planet-node">
          <circle cx="0" cy="0" r="23" fill="#f43f5e" fill-opacity="0.15" />
          <circle cx="0" cy="0" r="20" fill="none" stroke="#fb7185" stroke-width="1.2" stroke-dasharray="3 3" class="reticle" />
          <circle cx="0" cy="0" r="13" fill="url(#planet-crimson)" />
          <circle cx="-18" cy="-8" r="2.5" fill="#fecdd3" />
          <rect x="-64" y="19" width="128" height="34" rx="6" fill="url(#hud-glass)" stroke="#f43f5e" stroke-width="1.2" />
          <text x="-54" y="33" class="sans" fill="#f8fafc" font-size="11" font-weight="bold">AI + Vibe Lab</text>
          <text x="-54" y="46" class="mono" fill="#fb7185" font-size="9">Python + AI Agents</text>
        </g>
      </g>
    </g>
  </g>

  <g transform="translate(24, 526)">
    <g class="dock-group">
      <rect x="0" y="0" width="160" height="34" rx="8" class="dock-item" />
      <circle cx="18" cy="17" r="5" fill="#fbbf24" />
      <text x="32" y="21" class="mono" fill="#f8fafc" font-size="11" font-weight="bold">SUN: Pshravan04</text>
    </g>

    <g class="dock-group">
      <rect x="172" y="0" width="164" height="34" rx="8" class="dock-item" />
      <circle cx="190" cy="17" r="5" fill="#22d3ee" />
      <text x="204" y="21" class="mono" fill="#f8fafc" font-size="11" font-weight="bold">01: LatticeSkill</text>
    </g>

    <g class="dock-group">
      <rect x="348" y="0" width="164" height="34" rx="8" class="dock-item" />
      <circle cx="366" cy="17" r="5" fill="#10b981" />
      <text x="380" y="21" class="mono" fill="#f8fafc" font-size="11" font-weight="bold">02: OnlineSevak</text>
    </g>

    <g class="dock-group">
      <rect x="524" y="0" width="164" height="34" rx="8" class="dock-item" />
      <circle cx="542" cy="17" r="5" fill="#c084fc" />
      <text x="556" y="21" class="mono" fill="#f8fafc" font-size="11" font-weight="bold">03: PropTech CRM</text>
    </g>

    <g class="dock-group">
      <rect x="700" y="0" width="152" height="34" rx="8" class="dock-item" />
      <circle cx="718" cy="17" r="5" fill="#fb7185" />
      <text x="732" y="21" class="mono" fill="#f8fafc" font-size="11" font-weight="bold">04: AI Vibe Lab</text>
