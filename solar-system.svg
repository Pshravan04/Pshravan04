<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="100%" height="580">
  <defs>
    <radialGradient id="space-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="45%" stop-color="#070b16" />
      <stop offset="100%" stop-color="#020409" />
    </radialGradient>

    <radialGradient id="nebula-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="nebula-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="sun-corona" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#f59e0b" stop-opacity="0.55" />
      <stop offset="70%" stop-color="#ea580c" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="sun-sphere" cx="32%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="28%" stop-color="#fef08a" />
      <stop offset="68%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#9a3412" />
    </radialGradient>

    <radialGradient id="planet-cyan" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ecfeff" />
      <stop offset="32%" stop-color="#22d3ee" />
      <stop offset="75%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#082f49" />
    </radialGradient>

    <radialGradient id="planet-emerald" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ecfdf5" />
      <stop offset="32%" stop-color="#34d399" />
      <stop offset="75%" stop-color="#059669" />
      <stop offset="100%" stop-color="#022c22" />
    </radialGradient>

    <radialGradient id="planet-purple" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#faf5ff" />
      <stop offset="32%" stop-color="#c084fc" />
      <stop offset="75%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#2e1065" />
    </radialGradient>

    <radialGradient id="planet-crimson" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="32%" stop-color="#fb7185" />
      <stop offset="75%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#4c0519" />
    </radialGradient>

    <linearGradient id="hud-glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: Courier New, Courier, monospace; }
    .sans { font-family: Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, sans-serif; }

    .orbit-ring {
      fill: none;
      stroke: #1e293b;
      stroke-width: 1.4;
      stroke-dasharray: 6 6;
    }

    .orbit-1 { transform-origin: 450px 285px; animation: spin 16s linear infinite; }
    .orbit-2 { transform-origin: 450px 285px; animation: spin 26s linear infinite; }
    .orbit-3 { transform-origin: 450px 285px; animation: spin 38s linear infinite; }
    .orbit-4 { transform-origin: 450px 285px; animation: spin 50s linear infinite; }

    .counter-1 { animation: counterSpin 16s linear infinite; }
    .counter-2 { animation: counterSpin 26s linear infinite; }
    .counter-3 { animation: counterSpin 38s linear infinite; }
    .counter-4 { animation: counterSpin 50s linear infinite; }

    .orbit-1:hover, .orbit-1:hover .counter-1,
    .orbit-2:hover, .orbit-2:hover .counter-2,
    .orbit-3:hover, .orbit-3:hover .counter-3,
    .orbit-4:hover, .orbit-4:hover .counter-4 {
      animation-play-state: paused;
      cursor: pointer;
    }

    .planet-node {
      transition: transform 0.25s ease;
      cursor: pointer;
    }
    .planet-node:hover {
      transform: scale(1.15);
    }

    .reticle {
      opacity: 0.25;
      transition: opacity 0.25s ease;
    }
    .planet-node:hover .reticle {
      opacity: 1;
    }

    .dock-item {
      fill: #0f172a;
      stroke: #1e293b;
      stroke-width: 1.2;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .dock-group:hover .dock-item {
      fill: #1e293b;
      stroke: #38bdf8;
    }

    .sun-flare { transform-origin: 450px 285px; animation: pulseSun 3s ease-in-out infinite; }
    .twinkle { animation: starPulse 2.4s ease-in-out infinite; }

    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes counterSpin { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
    @keyframes pulseSun { 0%, 100% { transform: scale(1); opacity: 0.85; } 50% { transform: scale(1.14); opacity: 1; } }
    @keyframes starPulse { 0%, 100% { opacity: 0.9; } 50% { opacity: 0.2; } }
  </style>

  <rect width="900" height="580" rx="16" fill="url(#space-bg)" />
  <rect x="4" y="4" width="892" height="572" rx="14" fill="none" stroke="#1e293b" stroke-width="2" />

  <circle cx="240" cy="180" r="180" fill="url(#nebula-cyan)" />
  <circle cx="670" cy="390" r="200" fill="url(#nebula-purple)" />

  <line x1="450" y1="44" x2="450" y2="516" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.55" />
  <line x1="20" y1="285" x2="880" y2="285" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.55" />

  <g fill="#94a3b8">
    <circle cx="85" cy="95" r="1.5" class="twinkle" />
    <circle cx="210" cy="75" r="1.2" />
    <circle cx="780" cy="90" r="1.6" class="twinkle" />
    <circle cx="825" cy="210" r="1.1" />
    <circle cx="110" cy="430" r="1.3" />
    <circle cx="240" cy="475" r="1.5" class="twinkle" />
    <circle cx="745" cy="445" r="1.4" />
    <circle cx="675" cy="135" r="1.1" />
    <circle cx="145" cy="230" r="1.3" class="twinkle" />
    <circle cx="810" cy="375" r="1.2" />
  </g>
  <g fill="#38bdf8">
    <circle cx="165" cy="145" r="1.8" class="twinkle" />
    <circle cx="730" cy="320" r="1.6" />
    <circle cx="320" cy="85" r="1.5" />
    <circle cx="590" cy="465" r="1.8" class="twinkle" />
  </g>

  <rect x="4" y="4" width="892" height="40" rx="14" fill="#090d16" fill-opacity="0.9" />
  <line x1="4" y1="44" x2="896" y2="44" stroke="#1e293b" stroke-width="1" />
  <circle cx="26" cy="24" r="7" fill="#22d3ee" fill-opacity="0.25" />
  <circle cx="26" cy="24" r="3.5" fill="#22d3ee" />
  <text x="42" y="28" class="mono" fill="#f8fafc" font-size="12" font-weight="bold">ASTROMETRY_OS // CORE: PSHRAVAN04</text>
  <text x="615" y="28" class="mono" fill="#38bdf8" font-size="11">[HOVER PLANET TO LOCK ORBIT]</text>

  <circle cx="450" cy="285" r="82" class="orbit-ring" />
  <circle cx="450" cy="285" r="134" class="orbit-ring" />
  <circle cx="450" cy="285" r="186" class="orbit-ring" />
  <circle cx="450" cy="285" r="234" class="orbit-ring" />

  <g class="planet-node">
    <circle cx="450" cy="285" r="58" fill="url(#sun-corona)" class="sun-flare" />
    <circle cx="450" cy="285" r="36" fill="none" stroke="#fde047" stroke-width="1.2" stroke-dasharray="4 4" class="reticle" />
    <circle cx="450" cy="285" r="28" fill="url(#sun-sphere)" />
    <rect x="392" y="322" width="116" height="24" rx="6" fill="url(#hud-glass)" stroke="#f59e0b" stroke-width="1.2" />
    <circle cx="406" cy="334" r="4" fill="#fde047" />
    <text x="416" y="338" class="mono" fill="#fde047" font-size="11" font-weight="bold">PSHRAVAN04</text>
  </g>

  <g class="orbit-1">
    <g transform="translate(450, 203)">
      <g class="counter-1">
        <g class="planet-node">
          <circle cx="0" cy="0" r="22" fill="#22d3ee" fill-opacity="0.15" />
          <circle cx="0" cy="0" r="19" fill="none" stroke="#22d3ee" stroke-width="1.2" stroke-dasharray="3 3" class="reticle" />
          <circle cx="0" cy="0" r="12" fill="url(#planet-cyan)" />
          <circle cx="16" cy="-10" r="3" fill="#e2e8f0" />
          <rect x="-64" y="18" width="128" height="34" rx="6" fill="url(#hud-glass)" stroke="#22d3ee" stroke-width="1.2" />
          <text x="-54" y="32" class="sans" fill="#f8fafc" font-size="11" font-weight="bold">LatticeSkill</text>
          <text x="-54" y="45" class="mono" fill="#22d3ee" font-size="9">Next.js + Realtime</text>
        </g>
      </g>
    </g>
  </g>

  <g class="orbit-2">
    <g transform="translate(584, 285)">
      <g class="counter-2">
