<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="520">
  <style>
    .space { fill: #07080d; }
    .hud-border { fill: none; stroke: #1e293b; stroke-width: 4; }
    .orbit { fill: none; stroke: #1e293b; stroke-width: 2; stroke-dasharray: 6 6; }
    .font-px { font-family: 'Courier New', Courier, monospace; font-weight: bold; }
    .sun-glow { animation: sunPulse 2s steps(2, start) infinite; }
    
    /* Orbital Rotations around (400, 260) */
    .orbit-1 { transform-origin: 400px 260px; animation: spin 14s linear infinite; }
    .orbit-2 { transform-origin: 400px 260px; animation: spin 22s linear infinite; }
    .orbit-3 { transform-origin: 400px 260px; animation: spin 32s linear infinite; }
    .orbit-4 { transform-origin: 400px 260px; animation: spin 44s linear infinite; }

    /* Counter-rotation so planet labels stay upright */
    .counter-1 { animation: counterSpin 14s linear infinite; }
    .counter-2 { animation: counterSpin 22s linear infinite; }
    .counter-3 { animation: counterSpin 32s linear infinite; }
    .counter-4 { animation: counterSpin 44s linear infinite; }

    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes counterSpin { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
    @keyframes sunPulse { 0%, 100% { opacity: 0.9; } 50% { opacity: 0.4; } }
  </style>

  <!-- Deep Space Pixel Background -->
  <rect width="800" height="520" class="space" />
  <rect x="6" y="6" width="788" height="508" class="hud-border" />

  <!-- Background Pixel Stars -->
  <g fill="#475569">
    <rect x="60" y="50" width="4" height="4" /><rect x="150" y="120" width="4" height="4" />
    <rect x="710" y="80" width="4" height="4" /><rect x="640" y="190" width="4" height="4" />
    <rect x="90" y="380" width="4" height="4" /><rect x="210" y="440" width="4" height="4" />
    <rect x="680" y="410" width="4" height="4" /><rect x="570" y="340" width="4" height="4" />
  </g>
  <g fill="#22d3ee">
    <rect x="120" y="240" width="4" height="4" /><rect x="670" y="280" width="4" height="4" />
    <rect x="310" y="60" width="4" height="4" /><rect x="490" y="460" width="4" height="4" />
  </g>

  <!-- Top Telemetry Header -->
  <text x="24" y="34" class="font-px" fill="#22d3ee" font-size="14">SOLAR_SYS // CORE: PSHRAVAN04</text>
  <text x="560" y="34" class="font-px" fill="#64748b" font-size="12">ORBITING BODIES: REPOSITORIES</text>

  <!-- Orbital Rings -->
  <circle cx="400" cy="260" r="75" class="orbit" />
  <circle cx="400" cy="260" r="125" class="orbit" />
  <circle cx="400" cy="260" r="175" class="orbit" />
  <circle cx="400" cy="260" r="220" class="orbit" />

  <!-- CENTRAL SUN: PSHRAVAN04 -->
  <g>
    <rect x="368" y="228" width="64" height="64" fill="#f59e0b" opacity="0.2" class="sun-glow" />
    <rect x="376" y="236" width="48" height="48" fill="#f59e0b" />
    <rect x="382" y="242" width="36" height="36" fill="#fbbf24" />
    <rect x="390" y="250" width="20" height="20" fill="#fef08a" />
    <rect x="352" y="298" width="96" height="18" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
    <text x="360" y="311" class="font-px" fill="#fbbf24" font-size="12">PSHRAVAN04</text>
  </g>

  <!-- ORBIT 1: LatticeSkill (Cyan Planet) -->
  <g class="orbit-1">
    <g transform="translate(400, 185)">
      <g class="counter-1">
        <rect x="-10" y="-10" width="20" height="20" fill="#06b6d4" />
        <rect x="-6" y="-6" width="12" height="12" fill="#67e8f9" />
        <rect x="-48" y="14" width="96" height="16" fill="#0f172a" stroke="#06b6d4" stroke-width="1" />
        <text x="-42" y="26" class="font-px" fill="#67e8f9" font-size="11">LatticeSkill</text>
      </g>
    </g>
  </g>

  <!-- ORBIT 2: OnlineSevak (Emerald Planet) -->
  <g class="orbit-2">
    <g transform="translate(525, 260)">
      <g class="counter-2">
        <rect x="-12" y="-12" width="24" height="24" fill="#10b981" />
        <rect x="-8" y="-8" width="12" height="12" fill="#6ee7b7" />
        <rect x="-45" y="16" width="90" height="16" fill="#0f172a" stroke="#10b981" stroke-width="1" />
        <text x="-38" y="28" class="font-px" fill="#6ee7b7" font-size="11">OnlineSevak</text>
      </g>
    </g>
  </g>

  <!-- ORBIT 3: PropTech-Portals (Ringed Purple Planet) -->
  <g class="orbit-3">
    <g transform="translate(225, 260)">
      <g class="counter-3">
        <rect x="-22" y="-3" width="44" height="6" fill="#c084fc" />
        <rect x="-13" y="-13" width="26" height="26" fill="#9333ea" />
        <rect x="-7" y="-7" width="14" height="14" fill="#d8b4fe" />
        <rect x="-54" y="17" width="108" height="16" fill="#0f172a" stroke="#9333ea" stroke-width="1" />
        <text x="-46" y="29" class="font-px" fill="#d8b4fe" font-size="11">PropTech-Web</text>
      </g>
    </g>
  </g>

  <!-- ORBIT 4: AI-Vibe-Lab (Crimson Outer Planet) -->
  <g class="orbit-4">
    <g transform="translate(400, 480)">
      <g class="counter-4">
        <rect x="-11" y="-11" width="22" height="22" fill="#f43f5e" />
        <rect x="-5" y="-5" width="10" height="10" fill="#fda4af" />
        <rect x="-46" y="-30" width="92" height="16" fill="#0f172a" stroke="#f43f5e" stroke-width="1" />
        <text x="-38" y="-18" class="font-px" fill="#fda4af" font-size="11">AI-Vibe-Lab</text>
      </g>
    </g>
  </g>

  <!-- Bottom HUD Legend -->
  <rect x="18" y="476" width="764" height="28" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
  <text x="30" y="494" class="font-px" fill="#94a3b8" font-size="11">[SUN] Pshravan04   [P1] LatticeSkill   [P2] OnlineSevak   [P3] PropTech-Web   [P4] AI-Vibe-Lab</text>
</svg>
