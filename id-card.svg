<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" width="100%" height="280">
  <style>
    .bg { fill: #0a0b10; }
    .border-outer { fill: none; stroke: #22d3ee; stroke-width: 4; }
    .border-inner { fill: none; stroke: #1e293b; stroke-width: 2; }
    .title-bar { fill: #111827; }
    .pixel-text { font-family: 'Courier New', Courier, monospace; font-weight: bold; fill: #f8fafc; }
    .label { font-family: 'Courier New', Courier, monospace; font-weight: bold; fill: #64748b; font-size: 12px; }
    .value { font-family: 'Courier New', Courier, monospace; font-weight: bold; fill: #e2e8f0; font-size: 13px; }
    .accent { fill: #22d3ee; }
    .amber { fill: #f59e0b; }
    .green { fill: #10b981; }
    .blink { animation: pulse 1.2s steps(2, start) infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.15; } }
  </style>

  <!-- Card Background & Pixel Frame -->
  <rect width="700" height="280" class="bg" />
  <rect x="6" y="6" width="688" height="268" class="border-outer" />
  <rect x="12" y="12" width="676" height="256" class="border-inner" />

  <!-- Corner Pixel Notches -->
  <rect x="4" y="4" width="10" height="10" class="accent" />
  <rect x="686" y="4" width="10" height="10" class="accent" />
  <rect x="4" y="266" width="10" height="10" class="accent" />
  <rect x="686" y="266" width="10" height="10" class="accent" />

  <!-- Top Header Bar -->
  <rect x="14" y="14" width="672" height="32" class="title-bar" />
  <rect x="24" y="25" width="10" height="10" class="green blink" />
  <text x="44" y="35" class="pixel-text" font-size="14">DEV_ID // CITIZEN_PASS: #PSP-04</text>
  <text x="530" y="35" class="pixel-text accent" font-size="13">[ LVL 20 SOLO DEV ]</text>

  <!-- Left Column: Pixel Avatar Frame -->
  <rect x="30" y="64" width="140" height="140" fill="#111827" stroke="#22d3ee" stroke-width="3" />
  <!-- 8-Bit Avatar Graphic -->
  <rect x="76" y="88" width="48" height="44" fill="#f59e0b" />
  <rect x="72" y="82" width="56" height="14" fill="#22d3ee" />
  <rect x="86" y="104" width="8" height="8" fill="#0a0b10" />
  <rect x="106" y="104" width="8" height="8" fill="#0a0b10" />
  <rect x="92" y="120" width="16" height="4" fill="#0a0b10" />
  <rect x="64" y="136" width="72" height="50" fill="#1e293b" />
  <rect x="84" y="136" width="32" height="50" fill="#22d3ee" />

  <!-- Barcode / Badge Footer under Avatar -->
  <rect x="30" y="216" width="140" height="32" fill="#111827" stroke="#1e293b" stroke-width="2" />
  <text x="45" y="237" class="pixel-text amber" font-size="12">STATUS: ONLINE</text>

  <!-- Center Column: Profile Metadata -->
  <text x="195" y="80" class="label">OPERATIVE NAME</text>
  <text x="195" y="98" class="pixel-text" font-size="18">SHRAVAN S. PHUTANE</text>

  <text x="195" y="126" class="label">CLASSIFICATION</text>
  <text x="195" y="144" class="value accent">Full-Stack Dev & Creative Tech</text>

  <text x="195" y="172" class="label">HOME SECTOR</text>
  <text x="195" y="190" class="value">Mumbai (MMR), India</text>

  <text x="195" y="218" class="label">GUILD / MODE</text>
  <text x="195" y="236" class="value amber">Solo Freelancer // BCA</text>

  <!-- Right Column: Skill Telemetry Bars -->
  <rect x="450" y="64" width="220" height="184" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
  <text x="466" y="86" class="pixel-text accent" font-size="13">SYSTEM TELEMETRY</text>

  <text x="466" y="112" class="label">FRONTEND (React/Next)</text>
  <rect x="466" y="118" width="180" height="10" fill="#1e293b" />
  <rect x="466" y="118" width="168" height="10" fill="#22d3ee" />

  <text x="466" y="148" class="label">BACKEND (Node/Py/DB)</text>
  <rect x="466" y="154" width="180" height="10" fill="#1e293b" />
  <rect x="466" y="154" width="155" height="10" fill="#10b981" />

  <text x="466" y="184" class="label">MOBILE & UI (Flutter/Figma)</text>
  <rect x="466" y="190" width="180" height="10" fill="#1e293b" />
  <rect x="466" y="190" width="145" height="10" fill="#f59e0b" />

  <text x="466" y="220" class="label">AI & VIBE WORKFLOWS</text>
  <rect x="466" y="226" width="180" height="10" fill="#1e293b" />
  <rect x="466" y="226" width="172" height="10" fill="#a855f7" />
</svg>
